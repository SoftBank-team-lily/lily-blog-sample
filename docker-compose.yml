services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog"]
      interval: 5s
      retries: 10

  # 블루 인스턴스
  app-blue:
    build:
      context: .
      args: { APP_VERSION: "1.0.0" }
    environment:
      APP_VERSION: "1.0.0"
      APP_COLOR: blue
      DB_URL: jdbc:postgresql://db:5432/blog
      DB_USERNAME: blog
      DB_PASSWORD: blog
    depends_on:
      db: { condition: service_healthy }

  # 그린 인스턴스 (전환 대상)
  app-green:
    build:
      context: .
      args: { APP_VERSION: "1.1.0" }
    environment:
      APP_VERSION: "1.1.0"
      APP_COLOR: green
      DB_URL: jdbc:postgresql://db:5432/blog
      DB_USERNAME: blog
      DB_PASSWORD: blog
    depends_on:
      db: { condition: service_healthy }

  # 가중치 조정으로 카나리 시연
  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [app-blue, app-green]
