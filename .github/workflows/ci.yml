name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build & Test
        run: ./gradlew build

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${GITHUB_SHA::7} \
            -t lily-blog-sample:${GITHUB_SHA::7} .

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=local \
            lily-blog-sample:${GITHUB_SHA::7}
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health/readiness && break
            sleep 2
          done
          curl -sf http://localhost:8080/api/posts
          curl -sf http://localhost:8080/version
          docker rm -f smoke
